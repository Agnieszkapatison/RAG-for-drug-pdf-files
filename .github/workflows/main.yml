name: CI Pipeline for RAG Project

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9.13
      - name: Install dependencies
        run: |
          python -m venv myenv
          source myenv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

  code_quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9.13
      - name: Install dependencies
        run: |
          python -m venv myenv
          source myenv/bin/activate
          pip install pre-commit
      - name: Run Pre-commit Hooks
        run: |
          source myenv/bin/activate
          pre-commit run --all-files

  tests:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9.13
      - name: Install dependencies
        run: |
          python -m venv myenv
          source myenv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Tests
        run: |
          source myenv/bin/activate
          chmod +x tools/run_tests.sh
          ./tools/run_tests.sh
      - name: Store Test Reports
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: reports/junit.xml
      - name: Store Coverage Reports
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: reports/coverage.xml

  security_scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9.13
      - name: Install dependencies
        run: |
          python -m venv myenv
          source myenv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Create directories for reports
        run: |
          mkdir -p reports
      - name: Scan for security issues
        run: |
          source myenv/bin/activate
          bandit -r src/ -o reports/bandit_report.txt
      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: reports/bandit_report.txt
