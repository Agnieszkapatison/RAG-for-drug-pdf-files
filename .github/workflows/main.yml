name: CI Pipeline for RAG Project

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9.13
      - name: Install dependencies
        run: |
          python -m venv myenv
          source myenv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

  code_quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9.13
      - name: Install dependencies
        run: |
          python -m venv myenv
          source myenv/bin/activate
          pip install pre-commit
      - name: Run Pre-commit Hooks
        run: |
          source myenv/bin/activate
          pre-commit run --all-files

  tests:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9.13
      - name: Install dependencies
        run: |
          python -m venv myenv
          source myenv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Tests
        run: |
          source myenv/bin/activate
          chmod +x tools/run_tests.sh
          ./tools/run_tests.sh
      - name: Store Test Reports
        if: success() || failure()
        uses: actions/upload-artifact@v3
        with:
          name: junit-report
          path: reports/junit.xml
      - name: Store Coverage Reports
        if: success() || failure()
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: reports/coverage.xml

  performance_tests:
    name: Run Performance Tests
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9.13
      - name: Install dependencies
        run: |
          python -m venv myenv
          source myenv/bin/activate
          pip install -r requirements.txt
      - name: Run Performance Tests
        run: |
          source myenv/bin/activate
          pytest tests/performance/ --benchmark-columns=min,max,mean,stddev --benchmark-json=reports/performance/performance.json
      - name: Store Performance Reports
        if: success() || failure()
        uses: actions/upload-artifact@v3
        with:
          name: performance-report
          path: reports/performance/
          
