[pytest]
asyncio_mode = auto  

testpaths = 
    tests/unit
    tests/integration
    tests/performance

# Default options for running tests.
addopts = 
    --cov=src  
    --cov-report=term-missing  
    --cov-report=html:reports/coverage_html  
    --cov-report=xml:reports/coverage.xml 
    --disable-warnings  
    --strict-markers  
    -p no:warnings  

# Register custom markers to categorize tests.
markers =
    unit: Marks a test as a unit test.
    integration: Marks a test as an integration test.
    performance: Marks a test as a performance test.

# Ignore specific directories when running tests.
norecursedirs = 
    .git  
    node_modules  
    venv 
    .venv  
    __pycache__  
    reports  
    tools

# Enable logging for test runs.
log_cli = true  
log_cli_level = INFO  

# Configure test coverage settings.
[coverage:run]
branch = True  
omit = 
    */tests/*
    */config.py
    */main.py
    */app.py
    */tools/*

[coverage:report]
fail_under = 80  
show_missing = True  
skip_covered = True 
