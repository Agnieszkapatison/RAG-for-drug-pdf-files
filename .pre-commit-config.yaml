exclude: >
  \.(csv|dat|sql|xls*)$  (?# exclude file types)
  |
  \.ipynb$                (?# exclude Jupyter notebooks)
  |
  ^tests/                 (?# exclude the tests directory)

repos:
  - repo: https://github.com/PyCQA/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        files: '^(?!tests/).*\.py$'
        additional_dependencies: [
          flake8-blind-except,
          flake8-breakpoint,
          flake8-broken-line,
          flake8-builtins,
          flake8-comprehensions,
          flake8-eradicate,
          flake8-expression-complexity,
          flake8-mutable,
          flake8-quotes,
          flake8-return,
          pandas-vet,
          pep8-naming,
          flake8-docstrings,
          flake8-pytest,
          flake8-todo,
        ]
        args:
          - --inline-quotes=double
          - --multiline-quotes=double
          - --max-line-length=120
          - --per-file-ignores=__init__.py:D104
          - --ignore=B902,PD901,ECE001,E501

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-merge-conflict
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/psf/black
    rev: 22.3.0
    hooks:
      - id: black
        files: '\.py$'
        args: [--line-length=120]

  - repo: https://github.com/pre-commit/mirrors-isort
    rev: "v5.10.1"
    hooks:
      - id: isort
        files: '\.py$'
